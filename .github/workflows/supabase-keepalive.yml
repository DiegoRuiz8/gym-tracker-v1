name: Supabase Keep-Alive

on:
  schedule:
    # Lunes y jueves a las 09:00 UTC
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query liviano a la tabla user_data
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/user_data?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $response"
          cat /tmp/response.json

          if [ "$response" -ge 400 ]; then
            echo "El query falló con status $response"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
